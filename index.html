<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>My Cute Shop ♡</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Mali","Noto Sans Thai",Arial,sans-serif;
  background:#fff7fb;
  color:#665761;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{display:none}

.menu-button{
  width:45px;
  height:45px;
  border:0;
  border-radius:15px;
  background:#fff0f6;
  color:#dc82a8;
  font-size:22px;
}

.menu-button:hover{background:#ffdcea}

.side-menu{
  position:fixed;
  top:0;
  right:-330px;
  width:310px;
  height:100vh;
  background:#fff;
  z-index:400;
  padding:25px;
  box-shadow:-5px 0 25px rgba(80,40,60,.12);
  transition:.3s;
  overflow-y:auto;
}

.side-menu.open{right:0}

.menu-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
  margin-bottom:25px;
}

.close-menu{
  border:0;
  background:#fff0f6;
  color:#d883a5;
  width:35px;
  height:35px;
  border-radius:12px;
}

.menu-item{
  width:100%;
  border:0;
  background:#fff7fa;
  color:#806b74;
  padding:15px;
  margin-bottom:10px;
  border-radius:15px;
  text-align:left;
  font-size:14px;
}

.menu-item:hover{background:#ffe4ef}

.container{
  padding:0 18px 100px;
}

.page{
  min-height:100vh;
}

.home-page{
  padding-bottom:105px;
}

.profile-banner{
  height:220px;
  margin:0;
  background:#ffddea;
  position:relative;
  overflow:hidden;
  background-size:cover;
  background-position:center;
}

.profile-banner::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.03),
    rgba(0,0,0,.12)
  );
}

.profile-nav{
  position:absolute;
  top:12px;
  left:0;
  right:0;
  z-index:2;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 14px;
}

.profile-label{
  color:white;
  font-weight:bold;
  text-shadow:0 1px 5px rgba(0,0,0,.25);
}

.profile-nav .menu-button{
  justify-self:end;
  background:rgba(255,255,255,.88);
}

.profile-head{
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 18px;
  margin-top:-40px;
  position:relative;
  z-index:3;
}

.profile-avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  object-fit:cover;
  background:#ffe5ef;
  border:4px solid white;
  box-shadow:0 3px 15px rgba(80,40,60,.14);
}

.profile-name{
  font-size:20px;
  font-weight:bold;
  color:#6f5a64;
  overflow-wrap:anywhere;
  padding-top:28px;
}

.profile-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:12px 18px 16px;
}

.profile-action{
  border:1px solid #ead7df;
  background:#fff;
  border-radius:13px;
  padding:11px;
  color:#806b74;
  font-weight:bold;
}

.profile-action:hover{
  background:#fff0f6;
}

.profile-divider{
  border-top:1px solid #eadbe2;
}

.home-links{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:14px 18px;
}

.home-link-btn{
  border:1px solid #ead7df;
  background:#fff;
  border-radius:13px;
  padding:11px 6px;
  color:#806b74;
  font-weight:bold;
}

.home-link-btn:hover{
  background:#fff0f6;
}

.home-product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  background:#fff;
}

.home-grid-item{
  aspect-ratio:1/1;
  border:0;
  padding:0;
  overflow:hidden;
  background:#fff0f6;
  position:relative;
}

.home-grid-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.search{
  width:100%;
  border:0;
  outline:0;
  background:#fff;
  padding:16px 20px;
  border-radius:18px;
  box-shadow:0 3px 15px rgba(255,150,190,.08);
}

.products-page{
  padding-top:20px;
}

.page-top{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.back-button{
  border:0;
  background:#fff0f6;
  color:#d77fa3;
  padding:10px 14px;
  border-radius:13px;
}

.page-title{
  font-size:21px;
  font-weight:bold;
  color:#d77fa3;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 0;
}

.category{
  border:1px solid #f3d4e1;
  background:#fff;
  color:#9b7d8a;
  border-radius:20px;
  padding:9px 15px;
  white-space:nowrap;
}

.category.active{
  background:#f6a4c5;
  color:#fff;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:15px;
}

.product{
  background:#fff;
  padding:10px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(255,150,190,.09);
  overflow:hidden;
}

.product-image-wrap{
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:15px;
  background:#fff0f6;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.product-name{
  font-size:14px;
  font-weight:bold;
  margin:10px 4px 3px;
}

.product-category{
  font-size:11px;
  color:#b6a3ab;
  margin:0 4px;
}

.product-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.price{
  color:#df7ca4;
  font-weight:bold;
}

.add{
  border:0;
  background:#f5a0c2;
  color:#fff;
  border-radius:12px;
  padding:8px 12px;
}

.cart-panel{
  position:fixed;
  right:0;
  top:0;
  width:380px;
  height:100vh;
  background:#fff;
  z-index:250;
  padding:22px;
  transform:translateX(100%);
  transition:.3s;
  box-shadow:-5px 0 25px rgba(80,40,60,.12);
  display:flex;
  flex-direction:column;
}

.cart-panel.open{
  transform:translateX(0);
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:bold;
}

.cart-close{
  border:0;
  background:#fff0f6;
  color:#d681a5;
  width:35px;
  height:35px;
  border-radius:12px;
}

.cart-list{
  flex:1;
  overflow-y:auto;
  margin-top:15px;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:10px 0;
  border-bottom:1px dashed #eadbe2;
}

.cart-image{
  width:55px;
  height:55px;
  border-radius:12px;
  object-fit:cover;
}

.cart-info{
  flex:1;
}

.cart-name{
  font-size:13px;
  font-weight:bold;
}

.cart-price{
  color:#df7ca4;
  font-size:12px;
  margin-top:4px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:6px;
}

.quantity button{
  width:24px;
  height:24px;
  border:0;
  border-radius:8px;
  background:#ffe5ef;
  color:#d97c9f;
}

.delete-item{
  border:0;
  background:none;
  color:#bca7b0;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.delete-item svg{
  width:18px;
  height:18px;
  stroke:currentColor;
}

.summary{
  border-top:1px dashed #e2d2da;
  padding-top:15px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin:8px 0;
  font-size:13px;
}

.total{
  color:#df77a2;
  font-size:19px;
  font-weight:bold;
}

.checkout,
.modal-button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:17px;
  margin-top:12px;
  background:#f49bc0;
  color:#fff;
  font-weight:bold;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(70,40,55,.28);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:470px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:25px;
  padding:25px;
  position:relative;
}

.modal-title{
  font-size:21px;
  font-weight:bold;
  color:#d77fa3;
  margin-bottom:18px;
}

.modal-close{
  position:absolute;
  top:15px;
  right:15px;
  width:36px;
  height:36px;
  border:0;
  border-radius:12px;
  background:#fff0f6;
  color:#d77fa3;
}

.detail-description{
  background:#fff7fa;
  border:1px solid #f0dce5;
  border-radius:16px;
  padding:16px;
  line-height:1.8;
  white-space:normal;
  word-break:break-word;
  max-height:60vh;
  overflow-y:auto;
}

.input{
  width:100%;
  padding:13px;
  border:1px solid #f0dce5;
  outline:0;
  border-radius:13px;
  margin:5px 0 10px;
}

textarea.input{
  resize:vertical;
}

.modal-button{
  border-radius:15px;
  margin-top:8px;
}

.cancel-button{
  background:#fff0f5;
  color:#bd8fa2;
}

.dm-link{
  display:block;
  text-decoration:none;
  text-align:center;
  background:#fff7fa;
  border:1px solid #f0dce5;
  color:#806b74;
  padding:14px;
  border-radius:14px;
  margin:10px 0;
  font-weight:bold;
}

.dm-link:hover{
  background:#ffe4ef;
}

.copy-row{
  display:flex;
  gap:8px;
  align-items:center;
  margin:8px 0 14px;
}

.copy-value{
  flex:1;
  background:#fff7fa;
  border:1px solid #f0dce5;
  padding:12px;
  border-radius:12px;
  word-break:break-all;
}

.copy-btn{
  border:0;
  background:#ffe4ef;
  color:#c97e9d;
  padding:11px 12px;
  border-radius:12px;
}

.payment-card{
  background:#fffafd;
  border:1px solid #f0dce5;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.qr{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:15px;
  background:#fff0f6;
}

.slip-preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:15px;
  margin-top:10px;
  background:#fff7fa;
}

.confirm-disabled{
  opacity:.45;
  cursor:not-allowed;
}

.admin-section{
  border-top:1px dashed #ead9e1;
  margin-top:18px;
  padding-top:15px;
}

.admin-row{
  display:flex;
  gap:7px;
  align-items:center;
  margin-bottom:8px;
}

.admin-row input{
  flex:1;
  padding:10px;
  border:1px solid #f0dce5;
  border-radius:12px;
  outline:0;
}

.admin-row button{
  border:0;
  padding:10px 12px;
  border-radius:11px;
  background:#ffe4ef;
  color:#c97e9d;
}

.settings-home{
  display:grid;
  gap:12px;
}

.settings-page{
  display:none;
}

.settings-page.active{
  display:block;
}

.settings-card{
  border:1px solid #f0dce5;
  background:#fffafd;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.settings-button{
  width:100%;
  border:1px solid #ead7df;
  background:#fff;
  color:#806b74;
  padding:16px;
  border-radius:16px;
  text-align:left;
  font-weight:bold;
}

.settings-button:hover{
  background:#fff0f6;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:rgba(255,255,255,.97);
  border-top:1px solid #eadbe2;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:500;
  box-shadow:0 -4px 15px rgba(80,40,60,.06);
}

.bottom-nav button{
  border:0;
  background:none;
  color:#a88f99;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:10px;
}

.bottom-nav button.active{
  color:#e184aa;
}

.nav-icon{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.cart-nav-wrap{
  position:relative;
}

.cart-badge{
  position:absolute;
  top:-3px;
  right:5px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:10px;
  background:#f49bc0;
  color:#fff;
  font-size:10px;
  line-height:18px;
  text-align:center;
}

.printer-wrap{
  position:relative;
  width:100%;
  height:390px;
  overflow:hidden;
  background:#fff7fb;
  border-radius:18px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:58px;
}

.printer-machine{
  position:absolute;
  top:12px;
  width:240px;
  height:75px;
  border-radius:14px 14px 8px 8px;
  background:#eadde2;
  box-shadow:0 5px 12px rgba(80,40,60,.12);
  z-index:3;
}

.printer-slot{
  position:absolute;
  left:20px;
  right:20px;
  bottom:-4px;
  height:12px;
  background:#665761;
  border-radius:4px;
}

.receipt-paper{
  position:absolute;
  top:55px;
  width:205px;
  min-height:280px;
  background:#fff;
  border:1px solid #eadbe2;
  padding:18px 14px;
  font-family:Arial,sans-serif;
  font-size:11px;
  color:#444;
  box-shadow:0 3px 10px rgba(80,40,60,.08);
  z-index:2;
  transform:translateY(-205px);
  transition:transform 1.8s cubic-bezier(.22,.61,.36,1);
  touch-action:none;
  user-select:none;
}

.printer-wrap.printing .receipt-paper{
  transform:translateY(15px);
}

.receipt-paper.dragging{
  transition:none;
  cursor:grabbing;
}

.barcode{
  height:42px;
  margin:8px auto;
  width:145px;
  display:flex;
  align-items:stretch;
  justify-content:center;
  gap:2px;
  overflow:hidden;
}

.barcode i{
  display:block;
  background:#222;
  height:100%;
}

.receipt-table{
  width:100%;
  border-collapse:collapse;
  font-size:10px;
}

.receipt-table td{
  padding:3px 0;
  vertical-align:top;
}

.receipt-table td:nth-child(2){
  text-align:center;
}

.receipt-table td:last-child{
  text-align:right;
}

.receipt-rule{
  border-top:1px solid #222;
  margin:8px 0;
}

.receipt-drag-hint{
  text-align:center;
  font-size:10px;
  color:#aaa;
  margin-top:5px;
}

@media(max-width:700px){
  .home-links{
    gap:6px;
    padding:12px;
  }

  .home-link-btn{
    font-size:11px;
    padding:11px 4px;
  }

  .cart-panel{
    width:100%;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div id="app"></div>

<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">
  <div class="menu-title">
    <span>เมนู</span>
    <button class="close-menu" onclick="closeMenu()">×</button>
  </div>

  <button class="menu-item" onclick="showHome();closeMenu()">
    หน้าร้าน
  </button>

  <button class="menu-item" onclick="openProducts();closeMenu()">
    สินค้าทั้งหมด
  </button>

  <button class="menu-item" onclick="openCart();closeMenu()">
    รถเข็น
  </button>

  <button class="menu-item" onclick="openDM();closeMenu()">
    ติดต่อ
  </button>

  <button class="menu-item" onclick="showAdminSettings();closeMenu()">
    ตั้งค่าแอดมิน
  </button>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button id="navHome" onclick="showHome()">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M3 10.5 12 3l9 7.5"></path>
      <path d="M5.5 9.5V21h13V9.5"></path>
      <path d="M9.5 21v-6h5v6"></path>
    </svg>
    <span>หน้าร้าน</span>
  </button>

  <button id="navProducts" onclick="openProducts()">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M5 8h14l-1 13H6L5 8Z"></path>
      <path d="M8 8a4 4 0 0 1 8 0"></path>
    </svg>
    <span>สินค้า</span>
  </button>

  <button id="navCart" class="cart-nav-wrap" onclick="openCart()">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <circle cx="9" cy="20" r="1.5"></circle>
      <circle cx="18" cy="20" r="1.5"></circle>
      <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.5L21 8H6"></path>
    </svg>
    <span>รถเข็น</span>
    <span id="cartBadge" class="cart-badge">0</span>
  </button>

  <button id="navDM" onclick="openDM()">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v7a3.5 3.5 0 0 1-3.5 3.5H11l-5 4v-4.7A3.5 3.5 0 0 1 4 12.5v-7Z"></path>
    </svg>
    <span>ติดต่อ</span>
  </button>

</nav>

<!-- CART -->
<div class="cart-panel" id="cartPanel">

  <div class="cart-header">
    <span>รถเข็น</span>
    <button class="cart-close" onclick="closeCart()">×</button>
  </div>

  <div class="cart-list" id="cartList"></div>

  <div class="summary">
    <div class="summary-row">
      <span>จำนวน</span>
      <span id="cartAmount">0</span>
    </div>

    <div class="summary-row total">
      <span>รวม</span>
      <span id="cartTotal">0 ฿</span>
    </div>

    <button class="checkout" onclick="openCheckout()">
      ชำระเงิน
    </button>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
/* =========================
   DEFAULT DATA
========================= */

const defaults={
  name:"Akines shop",
  description:"ยินดีต้อนรับ",
  readText:"ใส่รายละเอียดที่ต้องการให้แสดงเมื่อกด read ตรงนี้",

  logo:"",
  banner:"",

  bankName:"ชื่อธนาคาร",
  bankNumber:"000-000-00000",

  walletName:"True money",
  walletNumber:"000-000-0000",

  paymentNote:"ข้อความ",

  qr:"",

  categories:[
    "ทั้งหมด",
    "เสื้อผ้า",
    "ของใช้",
    "อื่นๆ"
  ],

  homeLinks:[
    {
      label:"ex work",
      url:"#"
    },
    {
      label:"check q",
      url:"#"
    },
    {
      label:"credit",
      url:"#"
    }
  ]
};

/* =========================
   SAFE STORAGE
========================= */

function readJSON(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    return raw?JSON.parse(raw):fallback;
  }catch(e){
    console.warn("Invalid local data:",key,e);
    return fallback;
  }
}

let shop={
  ...defaults,
  ...(readJSON("shopData",{})||{})
};

let products=readJSON("products",[
  {
    id:1,
    name:"สินค้า A",
    price:99,
    category:"เสื้อผ้า",
    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80",
    description:"รายละเอียดสินค้า A",
    exampleLink:""
  },
  {
    id:2,

/* =========================

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function openExternal(url){
  if(!url||url==="#")return;
  window.open(url,"_blank","noopener,noreferrer");
}

function showModal(html){
  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function openMenu(){
  document.getElementById("sideMenu").classList.add("open");
}

function closeMenu(){
  document.getElementById("sideMenu").classList.remove("open");
}

function setActiveNav(id){
  document.querySelectorAll(".bottom-nav button")
    .forEach(b=>b.classList.remove("active"));

  const el=document.getElementById(id);
  if(el)el.classList.add("active");
}

function addToCart(id){

  const p=products.find(x=>x.id===id);
  if(!p)return;

  const item=cart.find(x=>x.id===id);

  if(item){
    item.quantity++;
  }else{
    cart.push({
      id:p.id,
      name:p.name,
      price:Number(p.price)||0,
      image:p.image||"",
      quantity:1
    });
  }

  saveAll();
  renderCart();
}

function cartQuantity(){

  return cart.reduce(
    (sum,item)=>sum+(Number(item.quantity)||0),
    0
  );
}

function renderCart(){

  const list=document.getElementById("cartList");
  const badge=document.getElementById("cartBadge");

  if(badge){
    badge.textContent=cartQuantity();
  }

  if(!list)return;

  if(!cart.length){

    list.innerHTML=`
      <div style="
        text-align:center;
        padding:50px 10px;
        color:#b9a4ad;
      ">
        ยังไม่มีสินค้าในรถเข็น
      </div>
    `;

  }else{

    list.innerHTML=cart.map(item=>`

      <div class="cart-item">

        ${
          item.image
          ?
          `<img class="cart-image"
                src="${escapeHtml(item.image)}"
                alt="">`
          :
          `<div class="cart-image"></div>`
        }

        <div class="cart-info">

          <div class="cart-name">
            ${escapeHtml(item.name)}
          </div>

          <div class="cart-price">
            ${(item.price*item.quantity).toLocaleString()} ฿
          </div>

          <div class="quantity">

            <button onclick="changeQuantity(${item.id},-1)">
              −
            </button>

            <span>${item.quantity}</span>

            <button onclick="changeQuantity(${item.id},1)">
              ＋
            </button>

          </div>

        </div>

        <button
          class="delete-item"
          onclick="removeFromCart(${item.id})"
          title="ลบสินค้า"
          aria-label="ลบสินค้า">

          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.8"
               stroke-linecap="round"
               stroke-linejoin="round">

            <path d="M4 7h16"></path>
            <path d="M9 7V4h6v3"></path>
            <path d="M7 7l1 13h8l1-13"></path>
            <path d="M10 11v5"></path>
            <path d="M14 11v5"></path>

          </svg>

        </button>

      </div>

    `).join("");
  }

  const amount=cartQuantity();

  const total=cart.reduce(
    (sum,item)=>sum+(item.price*item.quantity),
    0
  );

  const amountBox=document.getElementById("cartAmount");
  const totalBox=document.getElementById("cartTotal");

  if(amountBox)amountBox.textContent=amount;

  if(totalBox){
    totalBox.textContent=
      total.toLocaleString()+" ฿";
  }
}

function changeQuantity(id,diff){

  const item=cart.find(x=>x.id===id);
  if(!item)return;

  item.quantity+=diff;

  if(item.quantity<=0){
    cart=cart.filter(x=>x.id!==id);
  }

  saveAll();
  renderCart();
}

function removeFromCart(id){

  cart=cart.filter(x=>x.id!==id);

  saveAll();
  renderCart();
}

function copyText(text){

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    navigator.clipboard
      .writeText(text)
      .then(()=>alert("คัดลอกแล้ว"));

  }else{

    const textarea=document.createElement("textarea");

    textarea.value=text;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    alert("คัดลอกแล้ว");
  }
}

function previewSlip(event){

  const file=event.target.files[0];

  if(!file){
    selectedSlip="";
    return;
  }

  if(!file.type.startsWith("image/")){

    alert("กรุณาแนบไฟล์รูปภาพเท่านั้น");

    event.target.value="";

    return;
  }

  const reader=new FileReader();

  reader.onload=e=>{

    selectedSlip=e.target.result;

    const preview=
      document.getElementById("slipPreview");

    if(preview){

      preview.innerHTML=`
        <img
          class="slip-preview"
          src="${selectedSlip}"
          alt="สลิป">
      `;
    }

    const button=
      document.getElementById("confirmOrderBtn");

    if(button){

      button.disabled=false;
      button.classList.remove(
        "confirm-disabled"
      );
    }
  };

  reader.readAsDataURL(file);
}

    return;
  }

  completeOrder(
    "โอนเงิน",

  );
}

/* =========================
   ORDER / RECEIPT
========================= */

function completeOrder(
  payment,
  slip,
  customerName,
  customerLine
){

  const now=new Date();

  const orderNumber=
    "INV-"+Date.now();

  const total=cart.reduce(
    (sum,item)=>sum+item.price*item.quantity,
    0
  );

  const amount=cart.reduce(
    (sum,item)=>sum+item.quantity,
    0
  );

  const orders=readJSON("orders",[]);

  orders.unshift({

    orderNumber,
    customerName,

    customerLine,

    items:cart.map(item=>({...item})),

    total,
    amount,

    payment,
    slip,

    createdAt:now.toISOString()

  });

  localStorage.setItem(
    "orders",
    JSON.stringify(orders)
  );

  const date=
    now.toLocaleDateString(
      "th-TH",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    );

  const time=
    now.toLocaleTimeString(
      "th-TH",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  let rows="";

  cart.forEach(item=>{

    rows+=`
      <tr>
        <td>${escapeHtml(item.name)}</td>
        <td>${item.quantity}</td>
        <td>${(item.price*item.quantity).toLocaleString()}</td>
      </tr>
    `;

  });

  let bars="";

  for(let i=0;i<38;i++){

    const w=
      ((orderNumber.charCodeAt(
        i%orderNumber.length
      )+i*7)%4)+1;

    bars+=`
      <i style="width:${w}px"></i>
    `;
  }

  showModal(`

    <div class="printer-wrap"
         id="printerWrap">

      <div class="printer-machine">
        <div class="printer-slot"></div>
      </div>

      <div
        class="receipt-paper"
        id="receiptPaper"
        onclick="downloadReceipt()"
        title="แตะใบเสร็จเพื่อบันทึกลงเครื่อง">

        <div style="
          text-align:center;
          font-size:17px;
          font-weight:bold;
        ">
          Receipt
        </div>

        <div class="receipt-rule"></div>

        <div style="
          text-align:center;
          font-size:15px;
          font-weight:bold;
        ">
          ${escapeHtml(shop.name)}
        </div>

        <table class="receipt-table">

          <tr>
            <td>Date</td>
            <td colspan="2">${date}</td>
          </tr>

          <tr>
            <td>Time</td>
            <td colspan="2">${time}</td>
          </tr>

          <tr>
            <td>Name</td>
            <td colspan="2">
              ${escapeHtml(customerName)}
            </td>
          </tr>

function downloadReceipt(){

  const paper=
    document.getElementById("receiptPaper");

  if(!paper){
    alert("ยังไม่พบใบเสร็จ");
    return;
  }

  const clone=
    paper.cloneNode(true);

  clone.style.position="static";
  clone.style.transform="none";
  clone.style.width="205px";
  clone.style.margin="0 auto";
  clone.style.boxShadow="none";
  clone.style.cursor="default";

  const html=`
<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Receipt</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#fff;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  color:#444;
}

.receipt-paper{
  width:205px;
  min-height:280px;
  background:#fff;
  border:1px solid #ddd;
  padding:18px 14px;
  font-size:11px;
  box-sizing:border-box;
}

.receipt-table{
  width:100%;
  border-collapse:collapse;
  font-size:10px;
}

.receipt-table td{
  padding:3px 0;
  vertical-align:top;
}

.receipt-table td:nth-child(2){
  text-align:center;
}

.receipt-table td:last-child{
  text-align:right;
}

.receipt-rule{
  border-top:1px solid #222;
  margin:8px 0;
}

.barcode{
  height:42px;
  margin:8px auto;
  width:145px;
  display:flex;
  align-items:stretch;
  justify-content:center;
  gap:2px;
  overflow:hidden;
}

.barcode i{
  display:block;
  background:#222;
  height:100%;
}

</style>

</head>

<body>

${clone.outerHTML}

</body>
</html>
`;

  const blob=
    new Blob(
      [html],
      {
        type:"text/html;charset=utf-8"
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    `receipt-${Date.now()}.html`;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}

/* =========================
   RECEIPT DRAG
========================= */

function enableReceiptDrag(){

  const paper=
    document.getElementById("receiptPaper");

  const wrap=
    document.getElementById("printerWrap");

  if(!paper||!wrap)return;

  let startY=0;
  let baseY=0;
  let drag=false;

  const down=e=>{

    drag=true;

    paper.classList.add("dragging");

    const p=
      e.touches
      ?e.touches[0]
      :e;

    startY=p.clientY;

    const transform=
      paper.style.transform||"";

    const match=
      transform.match(
        /translate\(0,\s*(-?\d+(?:\.\d+)?)px\)/
      );

    baseY=
      match
      ?Number(match[1])
      :15;
  };

  const move=e=>{

    if(!drag)return;

    const p=
      e.touches
      ?e.touches[0]
      :e;

    const dy=
      p.clientY-startY;

    paper.style.transform=
      `translate(0,${baseY+dy}px)`;

    if(e.cancelable){
      e.preventDefault();
    }
  };

  const up=()=>{

    if(!drag)return;

    drag=false;

    paper.classList.remove("dragging");

    const transform=
      paper.style.transform||"";

    const match=
      transform.match(
        /translate\(0,\s*(-?\d+(?:\.\d+)?)px\)/
      );

    const y=
      match
      ?Number(match[1])
      :15;

    if(y>90){

      paper.style.transform=
        "translate(0,180px)";

      const hint=
        document.querySelector(
          ".receipt-drag-hint"
        );

      if(hint){
        hint.textContent=
          "ดึงใบเสร็จออกแล้ว";
      }

    }else{

      paper.style.transform=
        "translate(0,15px)";
    }
  };

  paper.addEventListener(
    "touchstart",
    down,
    {passive:true}
  );

  paper.addEventListener(
    "touchmove",
    move,
    {passive:false}
  );

  paper.addEventListener(
    "touchend",
    up
  );

  paper.addEventListener(
    "mousedown",
    down
  );

  window.addEventListener(
    "mousemove",
    move
  );

  window.addEventListener(
    "mouseup",
    up
  );
}
