        /* ห้องทดลองฟอนต์: ดีไซน์อ้างอิงจากไฟล์ที่ผู้ใช้แนบ */
        /* แถบรูดสีเดียวกับเว็บไซต์แบบ custom: ไม่ใช้สี native ของ Chrome/Safari */
        .theme-range {
            position: relative;
            width: 100%;
            height: 24px;
            display: flex;

        }

        .theme-range-track {
            position: absolute;
            left: 0;

            top: 50%;
            height: 9px;
            transform: translateY(-50%);
            border-radius: 999px;
            background: var(--primary);

                inset 0 1px 2px rgba(107, 67, 91, .10),
                0 2px 8px color-mix(in srgb, var(--primary) 16%, transparent);
            pointer-events: none;
        }

        .theme-range-thumb {
            position: absolute;
            top: 50%;
            width: 20px;
            height: 20px;
            border-radius: 999px;
            transform: translate(-50%, -50%);

            border: 3px solid #fff;
            box-shadow: 0 3px 10px color-mix(in srgb, var(--primary) 38%, transparent);
            pointer-events: none;

        }

            padding: 0 !important;
            opacity: 0 !important;

        // --- Local template storage ---

            'blue_store_backup_v1',

        const isStorageQuotaError = (error) => {
            const name = String(error?.name || '');
            const code = Number(error?.code || 0);
            return name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED' || code === 22 || code === 1014;
        };

        const clearLegacyHeavyLocalStorage = () => {
            LEGACY_HEAVY_LOCAL_KEYS.forEach(key => {
                try { localStorage.removeItem(key); } catch (_) {}

        const safeLocalStorageSet = (key, value) => {
            try {
                localStorage.setItem(key, value);

            } catch (error) {
                if (isStorageQuotaError(error)) {
                    // ล้างเฉพาะ backup เก่าที่มีขนาดใหญ่ แล้วลองบันทึกค่าขนาดเล็กอีกครั้ง

        const openMojibaeCacheDb = () => new Promise((resolve, reject) => {
            if (!('indexedDB' in window)) return reject(new Error('IndexedDB not supported'));
            const request = indexedDB.open(LOCAL_CACHE_DB_NAME, LOCAL_CACHE_VERSION);
            request.onupgradeneeded = () => {
                const database = request.result;
                if (!database.objectStoreNames.contains(LOCAL_CACHE_STORE)) {
                    database.createObjectStore(LOCAL_CACHE_STORE, { keyPath: 'id' });
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error || new Error('เปิด IndexedDB ไม่สำเร็จ'));
        });

        const cacheDbRequest = async (mode, callback) => {
            const database = await openMojibaeCacheDb();
            return await new Promise((resolve, reject) => {
                const tx = database.transaction(LOCAL_CACHE_STORE, mode);
                const store = tx.objectStore(LOCAL_CACHE_STORE);
                let request;
                try { request = callback(store); } catch (error) { database.close(); reject(error); return; }
                if (request) {
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error || new Error('IndexedDB request failed'));
                } else {
                    tx.oncomplete = () => resolve(true);
                }
                tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction failed'));
                tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
            }).finally(() => database.close());
        };

        const cachePut = (record) => cacheDbRequest('readwrite', store => store.put(record));
        const cacheGet = (id) => cacheDbRequest('readonly', store => store.get(id));
        const cacheGetAll = () => cacheDbRequest('readonly', store => store.getAll());
        const cacheDelete = (id) => cacheDbRequest('readwrite', store => store.delete(id));

        const cacheLatestStoreDb = async (storeDb) => {

        const listRestorePoints = async () => {
            try {
                const records = await cacheGetAll();
                return (Array.isArray(records) ? records : [])
                    .filter(item => item?.kind === 'restore' && item?.data)
                    .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0))
                    .slice(0, 3);
            } catch (_) {

        const createRestorePoint = async (storeDb) => {
            const record = { id: `restore-${Date.now()}`, kind: 'restore', date: new Date().toISOString(), data: storeDb };
            await cachePut(record);
            const all = await cacheGetAll();

                .filter(item => item?.kind === 'restore')
                .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            for (const item of restores.slice(3)) {
                try { await cacheDelete(item.id); } catch (_) {}

        // --- Helpers ---
        const isHeicImageFile = (file) => {
            const name = String(file?.name || '').toLowerCase();
            const type = String(file?.type || '').toLowerCase();
            return /\.(heic|heif)$/.test(name) || type === 'image/heic' || type === 'image/heif';
        };

        const compressImageToBlob = async (file, callback, highQuality = false) => {
            if (!file) {
                callback(null, new Error('ไม่พบไฟล์รูปภาพ'));
                return;
            }

            let objectUrl = '';
            try {
                let sourceBlob = file;
                const originalName = String(file.name || 'image');
                const originalExt = originalName.includes('.') ? originalName.split('.').pop().toLowerCase() : '';

                // รูปจาก iPhone มักเป็น HEIC/HEIF จึงแปลงเป็น JPEG ให้อัตโนมัติก่อนอัปโหลด
                if (isHeicImageFile(file)) {
                    if (typeof window.heic2any !== 'function') {
                        throw new Error('ตัวแปลงรูป HEIC โหลดไม่สำเร็จ กรุณารีเฟรชหน้าเว็บแล้วลองใหม่');
                    }
                    let converted = await window.heic2any({
                        blob: file,
                        toType: 'image/jpeg',
                        quality: highQuality ? 0.92 : 0.84
                    });
                    if (Array.isArray(converted)) converted = converted[0];
                    if (!converted) throw new Error('ไม่สามารถแปลงรูป HEIC จากเครื่องนี้ได้');
                    sourceBlob = converted;
                }

                // GIF และ SVG คงไฟล์ต้นฉบับไว้ เพื่อไม่ให้ภาพเคลื่อนไหว/เวกเตอร์เสียรูป
                if (!isHeicImageFile(file) && ['gif', 'svg'].includes(originalExt)) {
                    callback(file, null);
                    return;
                }

                objectUrl = URL.createObjectURL(sourceBlob);
                const img = await new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error('เบราว์เซอร์อ่านรูปนี้ไม่ได้ กรุณาใช้ JPG, PNG, WebP หรือเลือกรูปจากแอปรูปภาพใหม่'));
                    image.src = objectUrl;
                });

                const MAX_WIDTH = highQuality ? 2000 : 1200;
                const MAX_HEIGHT = highQuality ? 2000 : 1200;
                let width = img.naturalWidth || img.width;
                let height = img.naturalHeight || img.height;
                if (!width || !height) throw new Error('ตรวจสอบขนาดรูปภาพไม่สำเร็จ');

                const scale = Math.min(1, MAX_WIDTH / width, MAX_HEIGHT / height);
                width = Math.max(1, Math.round(width * scale));
                height = Math.max(1, Math.round(height * scale));

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                if (!ctx) throw new Error('อุปกรณ์นี้ไม่สามารถประมวลผลรูปภาพได้');
                ctx.drawImage(img, 0, 0, width, height);

                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob(
                        result => result ? resolve(result) : reject(new Error('บีบอัดรูปภาพไม่สำเร็จ')),
                        'image/jpeg',
                        highQuality ? 0.92 : 0.84
                    );
                });

                const jpgName = originalName
                    .replace(/\.[^.]+$/, '')
                    .replace(/[^a-zA-Z0-9ก-๙_-]+/g, '-')
                    .replace(/-+/g, '-')
                    .replace(/^-|-$/g, '')
                    .slice(0, 80) + '.jpg';

                callback(new File([blob], jpgName || `image-${Date.now()}.jpg`, {
                    type: 'image/jpeg',
                    lastModified: Date.now(),
                }), null);
            } catch (error) {
                console.error('Prepare image error:', error);
                callback(null, error);
            } finally {
                if (objectUrl) URL.revokeObjectURL(objectUrl);
            }
        };

        const STORAGE_MAX_FILE_SIZE = 30 * 1024 * 1024;
        const STORAGE_IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'jpe', 'jfif', 'png', 'webp', 'gif', 'svg', 'avif', 'bmp', 'heic', 'heif'];
        const STORAGE_FONT_EXTENSIONS = ['ttf', 'otf', 'woff', 'woff2'];
        let cachedUploadAdmin = { userId: null, checkedAt: 0 };

        const sanitizeStorageFileName = (name = 'file') => {
            // Storage object key ใช้ ASCII เท่านั้น เพื่อป้องกัน Invalid key
            // จากชื่อไฟล์ภาษาไทย อีโมจิ ช่องว่าง และอักขระพิเศษบน iPhone
            const raw = String(name || 'file').trim();
            const dotIndex = raw.lastIndexOf('.');
            const ext = dotIndex > 0
                ? raw.slice(dotIndex + 1).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8)
                : '';
            const base = (dotIndex > 0 ? raw.slice(0, dotIndex) : raw)
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-zA-Z0-9_-]+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '')
                .slice(0, 50) || 'file';
            return ext ? `${base}.${ext}` : base;
        };

        const getExtensionFromMimeType = (mime = '') => {
            const map = {

        const normalizeHex = (hex, fallback = '#F09ABC') => {
            const value = String(hex || '').trim();
            return /^#[0-9A-Fa-f]{6}$/.test(value) ? value.toUpperCase() : fallback;
        };

        const mixHex = (colorA, colorB, amount = 0.5) => {
            const a = normalizeHex(colorA).slice(1);
            const b = normalizeHex(colorB, '#FFFFFF').slice(1);
            const t = Math.max(0, Math.min(1, Number(amount)));
            const channel = (i) => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t);
            return `#${[0,2,4].map(i => channel(i).toString(16).padStart(2, '0')).join('').toUpperCase()}`;
        };

        const applyThemeCssVariables = (theme) => {
            const primary = normalizeHex(theme?.primary, '#1687E8');
            const secondary = normalizeHex(theme?.secondary, '#67C7F5');
            const textColor = normalizeHex(theme?.text, '#12324A');
            const root = document.documentElement;
            root.style.setProperty('--primary', primary);
            root.style.setProperty('--secondary', secondary);
            root.style.setProperty('--theme-page', mixHex(primary, '#FFFFFF', 0.94));
            root.style.setProperty('--bg-color', mixHex(primary, '#FFFFFF', 0.94));
            root.style.setProperty('--theme-surface', mixHex(secondary, '#FFFFFF', 0.94));
            root.style.setProperty('--theme-soft', mixHex(primary, '#FFFFFF', 0.86));
            root.style.setProperty('--theme-soft-2', mixHex(secondary, '#FFFFFF', 0.76));
            root.style.setProperty('--theme-border', mixHex(primary, '#FFFFFF', 0.70));
            root.style.setProperty('--theme-text', textColor);

        const CustomSelect = ({ value, options, onChange, placeholder = "- เลือก -" }) => {

            try {
                const raw = localStorage.getItem(PRODUCT_VIEW_HISTORY_KEY);

        const recordProductView = (product) => {
            if (!product?.id) return;
            try {
                const now = Date.now();
                const id = String(product.id);
                const history = readProductViewHistory();
                const existing = history.find(item => String(item.id) === id);
                const nextItem = {
                    id,
                    count: Math.min(999, Number(existing?.count || 0) + 1),
                    lastViewed: now
                };
                const next = [
                    nextItem,
                    ...history.filter(item => String(item.id) !== id)
                ]
                    .sort((a, b) => Number(b.lastViewed || 0) - Number(a.lastViewed || 0))
                    .slice(0, 20);
                safeLocalStorageSet(PRODUCT_VIEW_HISTORY_KEY, JSON.stringify(next));

        };

        const getHistoryScore = (candidate, allProducts, history) => {
            if (!candidate) return 0;
            const byId = new Map((allProducts || []).map(product => [String(product.id), product]));
            let score = candidate.recommend ? 1.5 : 0;
            history.slice(0, 12).forEach((entry, index) => {
                const viewed = byId.get(String(entry.id));
                if (!viewed) return;
                const weight = Math.max(0.6, 2.8 - (index * 0.16)) + Math.min(3, Number(entry.count || 0) * 0.35);
                if (String(candidate.id) === String(viewed.id)) score += 6.5 * weight;
                if (candidate.family && viewed.family && candidate.family === viewed.family) score += 4.5 * weight;
                if (candidate.subCategory && viewed.subCategory && candidate.subCategory === viewed.subCategory) score += 3.2 * weight;
                if (candidate.category && viewed.category && candidate.category === viewed.category) score += 2.2 * weight;
                if (candidate.productType && viewed.productType && candidate.productType === viewed.productType) score += 1.5 * weight;
                if (candidate.networkScope && viewed.networkScope && candidate.networkScope === viewed.networkScope) score += 0.5 * weight;
            });
            return score;
        };

        function HomeSmartSearch({ db, navigateTo, onProductClick }) {

                return [...products]

            useEffect(() => {

        // --- Main App Component ---
        function App() {

            const looksLikeLegacyTemplateState = (state) => {
                if (!state || typeof state !== 'object') return true;

                    setDb(normalizeLoadedStoreDb(defaultInitialData));

                    setIsFetching(false);
                    setTimeout(() => setIsLoadingReady(true), 900);
                }
            };

            useEffect(() => {
                loadStoreData();
            }, []);

            useEffect(() => {
                if (TEMPLATE_MODE) {
                    setIsAdmin(true);
                    return;
                }
                let mounted = true;

                const syncAdminSession = async () => {
                    try {
                        const { data } = await supabaseClient.auth.getSession();
                        if (!mounted) return;
                        const user = data?.session?.user;
                        setIsAdmin(Boolean(user && String(user.id) === ADMIN_USER_ID));
                    } catch (error) {
                        console.warn('ตรวจสอบสถานะแอดมินไม่สำเร็จ', error);
                    }
                };

                syncAdminSession();
                const { data: authListener } = supabaseClient.auth.onAuthStateChange((_event, session) => {
                    const user = session?.user;
                    setIsAdmin(Boolean(user && String(user.id) === ADMIN_USER_ID));
                });

                return () => {
                    mounted = false;
                    authListener?.subscription?.unsubscribe?.();
                };
            }, []);

            useEffect(() => {
                const theme = db.settings?.themeColors || defaultInitialData.settings.themeColors;
                applyThemeCssVariables(theme);
            }, [db.settings?.themeColors]);
            // เมื่อแอดมินแก้ข้อมูล ให้ซิงก์ขึ้น Supabase อัตโนมัติแบบหน่วงเล็กน้อย
            useEffect(() => {
                if (!isAdmin || isFetching) return;
                const timer = window.setTimeout(async () => {
                    try {
                        await saveStoreToSupabase(db);
                    } catch (error) {
                        console.warn('บันทึกข้อมูลร้านค้าไป Supabase ไม่สำเร็จ', error);
                    }
                }, 700);
                return () => window.clearTimeout(timer);
            }, [isAdmin, isFetching, db]);

            // ลิงก์แชร์รุ่นเก่าเคยใส่ทั้ง ?product= และ #sugerpie/product= พร้อมกัน
            // บน Cloudflare Pages/เบราว์เซอร์บางตัวอาจเปิดแคชหรือเส้นทางผิดจนเห็นจอขาว
            // เมื่อหน้าเว็บเริ่มทำงาน ให้แปลงทุกลิงก์สินค้าเป็น hash route แบบเดียวทันที
            // เช่น https://your-domain.com/#product=9001 ซึ่งเป็นเส้นทางที่เสถียรกับเว็บ HTML ไฟล์เดียว
            useEffect(() => {
                const requestedKey = getRequestedProductKey();
                if (!requestedKey) return;
                try {
                    const normalizedHash = `#product=${encodeURIComponent(requestedKey)}`;
                    const cleanPath = window.location.pathname || '/';
                    const normalizedUrl = `${cleanPath}${normalizedHash}`;
                    if (window.location.search || window.location.hash !== normalizedHash) {
                        window.history.replaceState(null, '', normalizedUrl);
                    }
                } catch (error) {
                    console.warn('ปรับรูปแบบลิงก์สินค้าไม่สำเร็จ', error);
                }
            }, []);

            useEffect(() => {
                let cancelled = false;

                const openRequestedProduct = async () => {
                    const rawId = getRequestedProductKey();
                    if (!rawId || isFetching) return;

                    const localFound = (db.products || []).find(
                        p => String(p.id) === rawId || String(p.code || '') === rawId
                    );
                    if (localFound) {
                        if (cancelled) return;
                        setSelectedProduct(localFound);
                        setActiveView('detail');
                        window.scrollTo(0, 0);
                        return;
                    }

                    // Template ไม่มีฐานข้อมูลออนไลน์ จึงเปิดได้เฉพาะสินค้าที่มีอยู่ในไฟล์/LocalStorage เครื่องนี้
                    return;
                };

                openRequestedProduct();
                const handleRouteChange = () => openRequestedProduct();
                window.addEventListener('hashchange', handleRouteChange);
                window.addEventListener('popstate', handleRouteChange);
                return () => {
                    cancelled = true;
                    window.removeEventListener('hashchange', handleRouteChange);
                    window.removeEventListener('popstate', handleRouteChange);
                };

            const navigateTo = (view, stateUpdate = {}) => {
                setHistory(prev => [...prev, { view: activeView, category: currentCategory, sub: currentSubCategory, fam: currentFamily, search: searchQuery }]);

                if(stateUpdate.category !== undefined) setCurrentCategory(stateUpdate.category);
                if(stateUpdate.sub !== undefined) setCurrentSubCategory(stateUpdate.sub);
                if(stateUpdate.fam !== undefined) setCurrentFamily(stateUpdate.fam);
                else if (view !== 'products' || !stateUpdate.fam) setCurrentFamily(null);
                
                if(stateUpdate.searchQuery !== undefined) setSearchQuery(stateUpdate.searchQuery);
                else setSearchQuery(""); 
                
                window.scrollTo(0,0);
            };

            const openProductDetail = (product) => {

                setSelectedProduct(product);

                navigateTo('detail');
            };

            const goBack = () => {
                if (getRequestedProductKey()) {
                    try {
                        const cleanUrl = new URL(window.location.href);
                        cleanUrl.searchParams.delete('product');
                        cleanUrl.searchParams.delete('share');
                        cleanUrl.searchParams.delete('v');
                        cleanUrl.hash = '';
                        window.history.replaceState(null, '', cleanUrl.pathname + (cleanUrl.search || ''));
                    } catch (_) {
                        window.history.replaceState(null, '', window.location.pathname);
                    }
                }
                if(history.length === 0) return setActiveView('home');
                const prev = history[history.length - 1];
                setHistory(h => h.slice(0, -1));
                setActiveView(prev.view);
                setCurrentCategory(prev.category);
                setCurrentSubCategory(prev.sub);
                setCurrentFamily(prev.fam);
                setSearchQuery(prev.search || "");
                window.scrollTo(0,0);

            const addToCart = (product, selectedVariant = null, showModal = false) => {
                // ป้องกันเคส onClick ส่ง event เข้ามาแทนสินค้า ทำให้ตะกร้าเด้งจอสี/จอขาว
                if (!product || typeof product !== 'object' || product.nativeEvent || !product.id) {
                    console.warn('Invalid product passed to addToCart:', product);
                    return;
                }

                const productVariants = getProductVariantOptions(product);
                const variant = (selectedVariant && !selectedVariant.nativeEvent && typeof selectedVariant === 'object') ? selectedVariant : (productVariants[0] || null);

                setCart(prev => {
                    const cartItemId = `${product.id}${variant ? `-${variant.name || 'variant'}` : ''}`;
                    const existing = prev.find(item => item.cartItemId === cartItemId);
                    if (existing) {
                        return prev.map(item => item.cartItemId === cartItemId ? { ...item, qty: item.qty + 1 } : item);
                    }
                    const parsedPrice = variant ? Number(variant.price) : Number(product.price);
                    const priceToUse = Number.isFinite(parsedPrice) ? parsedPrice : 0;
                    return [...prev, { 
                        ...product, 
                        cartItemId, 
                        qty: 1, 
                        price: priceToUse,
                        selectedVariantName: variant ? variant.name : null,
                        images: Array.isArray(product.images) && product.images.length > 0 ? product.images : [defaultImageUrl]
                    }];
                });
                setCartAnimKey(k => k + 1); 
                
                if (showModal) {
                    setIsCartOpen(true);
                }
            };
            
            const updateCartQty = (cartItemId, amount) => {
                setCart(prev => prev.map(item => {
                    if (item.cartItemId === cartItemId) {
                        const newQty = item.qty + amount;
                        return newQty > 0 ? { ...item, qty: newQty } : item;
                    }
                    return item;
                }));
            };

            const openAdminControl = () => {
                if (TEMPLATE_MODE) {
                    setIsAdmin(true);
                    navigateTo('admin');
                    return;
                }
                if (isAdmin) {
                    navigateTo('admin');
                } else {
                    setIsAdminLoginOpen(true);
                }
            };

            const handleLogoutAdmin = async () => {
                if (TEMPLATE_MODE) {
                    navigateTo('home');
                    openConfirm('เทมเพลตออฟไลน์', 'ข้อมูลยังคงบันทึกอยู่ในเครื่องนี้', 'info');
                    return;
                }
                try {
                    await supabaseClient.auth.signOut();
                } catch (error) {
                    console.warn('Supabase sign out error:', error);
                }
                setIsAdmin(false);
                navigateTo('home');
                openConfirm('สำเร็จ', 'ออกจากระบบแอดมินแล้ว', 'info');
            };

            const handleLoginSubmit = async (email, password) => {
                if (TEMPLATE_MODE) {

                    setIsAdminLoginOpen(false);
                    navigateTo('admin');
                    return;
                }
                const safeEmail = String(email || '').trim();
                if (!safeEmail || !password) {
                    openConfirm('ข้อมูลไม่ครบ', 'กรุณากรอกอีเมลและรหัสผ่านแอดมิน', 'danger');
                    return;
                }

                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: safeEmail,
                        password
                    });

                    if (error) throw error;
                    const user = data?.user;
                    if (!user || String(user.id) !== ADMIN_USER_ID) {
                        await supabaseClient.auth.signOut();
                        openConfirm('ไม่มีสิทธิ์เข้าใช้งาน', 'บัญชีนี้ไม่ใช่บัญชีแอดมินของร้าน', 'danger');
                        return;
                    }

                    setIsAdmin(true);
                    setIsAdminLoginOpen(false);
                    navigateTo('admin');
                    openConfirm('เข้าสู่ระบบสำเร็จ', 'เชื่อมต่อระบบจัดการร้านค้ากับ Supabase แล้ว', 'info');
                } catch (error) {
                    console.error('Admin login error:', error);
                    openConfirm('เข้าสู่ระบบไม่สำเร็จ', error?.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'danger');
                }
            };

            const openConfirm = (title, message, type, onConfirm) => {
                setConfirmData({ isOpen: true, title, message, type, onConfirm });
            };

            const copyToClipboard = async (text, showToast = true) => {
                const value = String(text ?? '');
                let copied = false;

                // วิธีหลักสำหรับ Safari/iPhone และเบราว์เซอร์รุ่นใหม่ (เว็บต้องเป็น HTTPS)
                if (navigator.clipboard && window.isSecureContext) {
                    try {
                        await navigator.clipboard.writeText(value);
                        copied = true;
                    } catch (err) {
                        console.warn('Clipboard API failed, trying fallback:', err);
                    }
                }

                // วิธีสำรองสำหรับ Safari บางเวอร์ชันและ WebView
                if (!copied) {
                    const textArea = document.createElement('textarea');
                    textArea.value = value;
                    textArea.setAttribute('readonly', '');
                    textArea.setAttribute('aria-hidden', 'true');
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-9999px';
                    textArea.style.top = '0';
                    textArea.style.opacity = '0';
                    textArea.style.fontSize = '16px';
                    document.body.appendChild(textArea);

                    try {
                        textArea.focus({ preventScroll: true });
                        textArea.select();
                        textArea.setSelectionRange(0, textArea.value.length);
                        copied = document.execCommand('copy');
                    } catch (err) {
                        console.error('Fallback copy failed:', err);
                    } finally {
                        document.body.removeChild(textArea);
                    }
                }

                if (showToast) {
                    openConfirm(
                        copied ? "สำเร็จ" : "คัดลอกไม่สำเร็จ",
                        copied ? "คัดลอกข้อความแล้ว! สามารถนำไปวางได้เลยค่ะ" : "เบราว์เซอร์ไม่อนุญาตให้คัดลอกอัตโนมัติ กรุณากดค้างที่ข้อความแล้วเลือกคัดลอกค่ะ",
                        copied ? "info" : "danger"
                    );
                }
                return copied;
            };

            const handlePromoClick = (target) => {

                    } 
                    else if (db.categories?.main?.includes(target)) {
                        navigateTo('products', { category: target });
                    }
                    else {
                        navigateTo('products');
                    }
                } else {
                    navigateTo('products');
                }
            };

            if (isFetching) {
                return (
                    <div className="flex-1 w-full min-h-screen flex items-center justify-center bg-[var(--bg-color)]">
                        <div className="w-10 h-10 border-4 border-[var(--primary)] border-t-transparent rounded-full animate-spin opacity-50"></div>
                    </div>
                );
            }

            if (isLoadingScreen) {
                const loadingStars = [
                    { top: '2%', left: '48%', size: 18, delay: '0s' },
                    { top: '13%', right: '12%', size: 13, delay: '.25s' },
                    { top: '46%', right: '-1%', size: 17, delay: '.5s' },
                    { bottom: '8%', right: '21%', size: 12, delay: '.75s' },
                    { bottom: '2%', left: '43%', size: 16, delay: '1s' },
                    { bottom: '14%', left: '7%', size: 12, delay: '1.25s' },
                    { top: '43%', left: '-2%', size: 17, delay: '1.5s' },
                    { top: '12%', left: '15%', size: 11, delay: '1.7s' }
                ];
                return (
                    <div className="loading-stage flex-1 w-full min-h-screen flex flex-col items-center justify-center animate-fade-in relative overflow-hidden px-6">
                        <div className="absolute w-[420px] h-[420px] rounded-full bg-[#F6BCD3]/35 blur-[80px] loading-glow"></div>
                        <div className="absolute w-[300px] h-[300px] rounded-full border border-white/70 shadow-[0_0_70px_rgba(233,149,184,.28)] loading-glow"></div>

                        <div className="relative mb-9 w-64 h-64 flex items-center justify-center">
                            <div className="absolute inset-2 rounded-full border border-dashed border-[#E995B8]/30 loading-orbit"></div>
                            <div className="absolute inset-7 rounded-full border border-[#F6BCD3]/45 loading-orbit-reverse"></div>

                            <div className="absolute inset-0 loading-orbit">
                                {loadingStars.slice(0,4).map((star, index) => (
                                    <StarSVG key={`outer-${index}`} className="loading-star absolute text-[var(--primary)]" style={{...star, width: `${star.size}px`, height: `${star.size}px`, animationDelay: star.delay}} />
                                ))}
                            </div>
                            <div className="absolute inset-5 loading-orbit-reverse">
                                {loadingStars.slice(4).map((star, index) => (
                                    <StarSVG key={`inner-${index}`} className="loading-star absolute text-[var(--secondary)]" style={{...star, width: `${star.size}px`, height: `${star.size}px`, animationDelay: star.delay}} />
                                ))}
                            </div>

                            <div className="loading-logo-float relative z-10 flex items-center justify-center">
                                <div className="absolute w-44 h-44 rounded-full bg-gradient-to-tr from-[var(--primary)]/50 via-white/70 to-[var(--secondary)]/60 blur-2xl loading-glow"></div>

                                <img src={db.settings?.profilePic || defaultImageUrl} className="w-28 h-28 rounded-full border-[5px] border-white object-cover relative z-10 shadow-[0_18px_45px_rgba(146,74,108,.22)]" alt="Loading Profile" />
                                <StarSVG className="loading-star absolute -top-2 right-5 w-6 h-6 text-white z-20" />
                                <StarSVG className="loading-star absolute bottom-1 left-5 w-4 h-4 text-[var(--primary)] z-20" style={{animationDelay:'.7s'}} />
                            </div>

                            <span className="ml-1"><span className="loading-dot">.</span><span className="loading-dot">.</span><span className="loading-dot">.</span></span>

                        <div className="w-64 h-2.5 bg-white/80 rounded-full overflow-hidden relative shadow-inner border border-white">
                            <div className="absolute top-0 left-0 h-full bg-gradient-to-r from-[#F6BCD3] via-[#E995B8] to-[#DFA7EF] rounded-full animate-loading-bar shadow-[0_0_14px_rgba(240,154,188,.55)]"></div>
                        </div>

                        <div className="h-[94px] mt-6 flex items-start justify-center">
                            {isLoadingReady ? (

                                    <div className="mb-3 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/80 border border-white text-[12px] font-semibold text-[#9A7185] shadow-sm">
                                        <StarSVG className="w-3.5 h-3.5 text-[var(--primary)] animate-star-twinkle" />
                                        ร้านพร้อมแล้วค่ะ

                                    <button

                                    >

                                    </button>

                            )}
                        </div>
                    </div>
                );
            }

            const hideMainHeaderViews = ['admin', 'infoTerms', 'infoFAQ', 'infoHowToBuy'];

            return (

                    {!hideMainHeaderViews.includes(activeView) && (

                            <header className="sticky top-0 bg-white shadow-[0_4px_20px_rgba(0,0,0,0.02)] border-b border-slate-50 w-full z-40">
                                <div className="w-full max-w-[1600px] mx-auto px-4 md:px-8 xl:px-12 py-3.5 flex items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <h1 className="text-xl md:text-2xl font-bold tracking-tight cursor-pointer text-[var(--text-dark)] flex items-center gap-2" onClick={() => navigateTo('home')}>

                                            <span>{db.settings?.shopName || "ชื่อร้านของคุณ"}</span>
                                            {db.settings?.shopVerified !== false && <button type="button" onClick={(e)=>{e.stopPropagation();openConfirm(db.settings?.shopVerifiedTitle || 'ร้านค้ายืนยันแล้ว', db.settings?.shopVerifiedDetails || 'ยืนยันช่องทางติดต่อร้านค้าแล้ว', 'info')}} className="inline-flex items-center justify-center w-5 h-5 md:w-6 md:h-6 rounded-full bg-[var(--primary)] text-white shadow-sm hover:scale-110 transition-transform" title={db.settings?.shopVerifiedLabel || 'ร้านค้ายืนยันแล้ว'} aria-label="ดูรายละเอียดการยืนยันร้านค้า"><i className="fa-solid fa-check text-[10px] md:text-xs"></i></button>}

                                    </div>

        function ProductListView({ db, currentCategory, currentSubCategory, currentFamily, searchQuery, onlyRecommend, navigateTo, goBack, onProductClick, onAddToCart }) {

            else if (currentSubCategory) title = currentSubCategory.replace('ฟอนต์', '');

            const [currentPage, setCurrentPage] = useState(1);

                setCurrentPage(1);

            const isFontProduct = (product) => {
                const productType = String(product?.productType || '').trim();
                const category = String(product?.category || '').trim();
                // ใช้ประเภทสินค้าเป็นหลัก หากข้อมูลเก่าไม่มี productType จึงค่อยดู category
                if (productType) return productType === 'ฟอนต์' || productType === 'ฟอนต์ดึงเมลเอง';
                return category === 'ฟอนต์';

            const getFilteredProducts = (familyFilter, onlyCategory = null) => {

                if (familyFilter && familyFilter !== 'อื่นๆ') {
                    if (String(familyFilter).startsWith('เครืออื่น::')) {
                        const networkName = String(familyFilter).split('::')[1] || '';
                        products = products.filter(p => isFontProduct(p) && p.networkScope === 'other' && (p.otherNetworkName || 'ไม่ระบุชื่อเครือ') === networkName);
                    } else {
                        products = products.filter(p => p.family === familyFilter && p.networkScope !== 'other');
                    }
                }

                    const q = searchQuery.toLowerCase();
                    products = products.filter(p => 
                        (p.name || "").toLowerCase().includes(q) || 
                        (p.code || "").toLowerCase().includes(q) ||
                        (p.category || "").toLowerCase().includes(q) || 
                        (p.subCategory && p.subCategory.toLowerCase().includes(q)) || 
                        (p.family && p.family.toLowerCase().includes(q))
                    );
                }
                if (!onlyRecommend && !searchQuery) {
                    if (currentCategory === 'สินค้าอื่นๆ') products = products.filter(p => !isFontProduct(p));
                    else if (currentCategory && currentCategory !== 'ทั้งหมด') products = products.filter(p => p.category === currentCategory);
                    if (currentSubCategory) products = products.filter(p => p.subCategory === currentSubCategory);
                }
                
                if (onlyCategory === 'others' || familyFilter === 'อื่นๆ') products = products.filter(p => !isFontProduct(p));
                else if (onlyCategory === 'fonts') products = products.filter(p => isFontProduct(p));

                // หน้า Template ของ Mojibae: ในแต่ละเครือเรียงราคาต่ำ -> สูงเสมอ
                const getLowestPrice = (product) => {
                    const variantPrices = getProductVariantOptions(product)
                        .map(v => Number(v.price))

        function ThemeRange({ min = 0, max = 100, step = 1, value, onChange, ariaLabel = "ปรับค่า", className = "" }) {
            const minNum = Number(min);
            const maxNum = Number(max);
            const valueNum = Number(value);
            const safeRange = Math.max(0.0001, maxNum - minNum);
            const percent = Math.max(0, Math.min(100, ((valueNum - minNum) / safeRange) * 100));

            return (
                <div className={`theme-range ${className}`}>
                    <div className="theme-range-track"></div>
                    <div className="theme-range-thumb" style={{ left: `${percent}%` }}></div>
                    <input
                        type="range"
                        className="theme-range-native"
                        min={min}
                        max={max}
                        step={step}
                        value={value}
                        aria-label={ariaLabel}
                        onChange={e => onChange(Number(e.target.value))}
                    />
                </div>
            );

รวมชพณ
ตัวแถมต้องราคาถูกกว่าเท่านั้น

                        </div>

        function AdminProducts({ db, setDb, openConfirm }) {
            const [isAdding, setIsAdding] = useState(false);

            const saveProductOrder = async (productsToSave = db.products || [], showSuccess = true) => {

                    if (showSuccess) openConfirm('สำเร็จ', TEMPLATE_MODE ? 'บันทึกลำดับสินค้าไว้ในเครื่องนี้แล้ว' : 'บันทึกลำดับสินค้าออนไลน์เรียบร้อยแล้ว', 'info');
                } catch (err) {
                    openConfirm('บันทึกลำดับไม่สำเร็จ', err?.message || 'ไม่สามารถบันทึกลำดับสินค้าได้', 'danger');

            const handleSave = async (productData) => {
                openConfirm("ยืนยัน", "ต้องการบันทึกข้อมูลสินค้านี้ใช่หรือไม่?", "confirm", async () => {
                    const isNew = !editingProduct;
                    let storageReadyData;
                    try {
                        storageReadyData = await migrateProductAssetsToStorage(productData);
                    } catch (err) {
                        openConfirm("อัปโหลดไฟล์ไม่สำเร็จ", err?.message || "กรุณาลองเลือกไฟล์ใหม่อีกครั้ง", "danger");
                        return;
                    }

                    const cleanedOldPrice = storageReadyData.oldPrice === "" || storageReadyData.oldPrice === null || storageReadyData.oldPrice === undefined || Number(storageReadyData.oldPrice) <= 0 ? "" : Number(storageReadyData.oldPrice);
                    const existingProducts = db.products || [];
                    const existingProduct = existingProducts.find(p => p.id === storageReadyData.id);
                    const existingIndex = existingProducts.findIndex(p => p.id === storageReadyData.id);
                    const displayOrder = isNew
                        ? existingProducts.length
                        : getProductSortValue(existingProduct || storageReadyData, existingIndex >= 0 ? existingIndex : 0);
                    const newProduct = { ...storageReadyData, oldPrice: cleanedOldPrice, id: isNew ? Date.now() : storageReadyData.id, displayOrder };

                    setDb(prev => {
                        let newProducts = [...(prev.products || [])];
                        if (isNew) {
                            newProducts.push(newProduct);
                        } else {
                            newProducts = newProducts.map(p => p.id === newProduct.id ? newProduct : p);
                        }
                        return { ...prev, products: sortProductsByDisplayOrder(newProducts) };
                    });

                    if (!isNew && existingProduct) {
                        const oldUrls = collectProductStorageUrls(existingProduct);
                        const newUrls = new Set(collectProductStorageUrls(newProduct));
                        await deleteStorageFilesByUrls(oldUrls.filter(url => !newUrls.has(url)));
                    }

                    setIsAdding(false);
                    setEditingProduct(null);
                });
            };

            const handleDelete = (id) => {
                openConfirm("ลบสินค้า", "ยืนยันการลบสินค้านี้?", "danger", async () => {
                    const deletedProduct = (db.products || []).find(p => p.id === id);
                    setDb(prev => ({ ...prev, products: withUpdatedProductOrder(prev.products.filter(p => p.id !== id)) }));
                    if (deletedProduct) await deleteStorageFilesByUrls(collectProductStorageUrls(deletedProduct));
                });
            };

            const filteredProducts = (db.products || []).filter(p => 
                (p.name || "").toLowerCase().includes(searchTerm.toLowerCase()) || 
                (p.code || "").toLowerCase().includes(searchTerm.toLowerCase())
            );

            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            const displayProducts = filteredProducts.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            useEffect(() => {
                setCurrentPage(1);

            return (

                                                {isSavingOrder ? 'กำลังบันทึก...' : 'บันทึกลำดับสินค้า'}
                                            </button>
                                        )}
                                     </div>
                                </div>
                                <div className="flex flex-col gap-2">

                                                    </div>

                                                    <p className="font-bold text-[14px] text-[var(--theme-text)] truncate">{p.name}</p>
                                                </div>

                                                    <button onClick={() => setDb(prev => ({...prev, products: prev.products.map(item => item.id === p.id ? {...item, saleStatus: (item.saleStatus || 'active') === 'active' ? 'paused' : 'active'} : item)}))} className={`text-[11px] font-bold px-3 py-2 rounded-xl border ${(p.saleStatus || 'active') === 'active' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-rose-50 text-rose-600 border-rose-200'}`}>
                                                        <i className={`fa-solid ${(p.saleStatus || 'active') === 'active' ? 'fa-circle-check' : 'fa-circle-pause'} mr-1`}></i>{(p.saleStatus || 'active') === 'active' ? 'จำหน่ายอยู่' : 'หยุดจำหน่าย'}
                                                    </button>
                                                    <button onClick={() => setDb(prev => ({...prev, products: prev.products.map(item => item.id === p.id ? {...item, promoActive: !item.promoActive} : item)}))} className={`text-[11px] font-bold px-3 py-2 rounded-xl border ${p.promoActive ? 'bg-amber-50 text-amber-600 border-amber-200' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>
                                                        <i className="fa-solid fa-tags mr-1"></i>{p.promoActive ? 'มีโปร' : 'ไม่มีโปร'}
                                                    </button>
                                                    <button className="admin-product-edit-button text-[13px] font-bold text-[#3B82F6] hover:text-blue-700 transition-colors px-2" onClick={() => setEditingProduct(p)}>แก้ไข</button>

                                                </div>
                                            </div>
                                        );
                                    })}

                                {filteredProducts.length === 0 && (

                                {totalPages > 1 && (

                                    </div>

                            </div>

        function ProductForm({ initialData, onSave, onCancel, db }) {
            const [form, setForm] = useState(() => {
                const base = initialData || {
                    code: "", name: "", details: "", price: "", oldPrice: "",
                    recommend: false, saleStatus: "active", promoActive: false, promoLabel: "โปรโมชั่น", promoPrice: "", productType: "ฟอนต์", deliveryMode: "email", category: "ฟอนต์",
                    subCategory: "", family: "", networkScope: "own", otherNetworkName: "", hasTester: true,
                    images: [], apps: [], weights: [], fontUrl: null, variants: []
                };
                return {
                    ...base,
                    fontFiles: {
                        regular: base?.fontFiles?.regular || base?.fontUrl || base?.fontBase64 || null,
                        bold: base?.fontFiles?.bold || null,
                        light: base?.fontFiles?.light || null
                    }
                };
            });

            const [isUploadingFont, setIsUploadingFont] = useState(null);
            const [isUploadingMultiple, setIsUploadingMultiple] = useState(false);

            const SUPPORTED_APPS = db.categories?.apps || [];
            const FONT_WEIGHTS = db.categories?.weights || [];

            const toggleArrayItem = (field, item) => {
                setForm(prev => {
                    const currentArr = prev[field] || [];
                    if (currentArr.includes(item)) {
                        return { ...prev, [field]: currentArr.filter(i => i !== item) };
                    } else {
                        return { ...prev, [field]: [...currentArr, item] };
                    }
                });

                    <div className="mt-8 flex gap-3 pt-6 border-t border-slate-50">

                        <button onClick={() => { if(form.productType === 'ฟอนต์' && form.networkScope === 'other' && !(form.otherNetworkName||'').trim()){ alert('กรุณาเลือกเครืออื่นก่อนบันทึก'); return; } onSave({...form, hasTester: form.networkScope === 'other' ? false : form.hasTester}); }} disabled={Boolean(isUploadingFont)} className="flex-[2] py-4 bg-[var(--primary)] text-white rounded-[20px] font-bold hover:opacity-90 transition-colors shadow-sm disabled:opacity-50">บันทึกข้อมูล</button>
                    </div>
                </div>
            );
        }



        class AppErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, message: '' }; }
            static getDerivedStateFromError(error) { return { hasError: true, message: error?.message || 'เกิดข้อผิดพลาด' }; }
            componentDidCatch(error, info) { console.error('App render error:', error, info); }
            render() {
                if (this.state.hasError) {
                    return <div className="min-h-screen flex items-center justify-center bg-[var(--theme-page)] p-6"><div className="max-w-md w-full bg-white rounded-[28px] p-7 shadow-xl border border-[#F4DCE7] text-center"><div className="w-16 h-16 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-triangle-exclamation text-3xl"></i></div><h2 className="font-bold text-xl text-[var(--theme-text)] mb-2">หน้านี้เกิดข้อผิดพลาด</h2><p className="text-sm text-slate-500 mb-5 break-words">{this.state.message}</p><button onClick={() => window.location.reload()} className="w-full py-3 rounded-2xl bg-[var(--primary)] text-white font-bold">โหลดหน้าใหม่</button></div></div>;
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App/></AppErrorBoundary>);
    </script>

<!-- Mojibae pointer/touch sparkle trail -->
<style>
  #mojibae-sparkle-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 2147483000;
  }
  .mojibae-pointer-sparkle {
    position: fixed;
    left: 0;
    top: 0;
    width: 14px;
    height: 14px;
    display: grid;
    place-items: center;
    pointer-events: none;
    user-select: none;
    will-change: transform, opacity;
    transform: translate(-50%, -50%) scale(.55) rotate(0deg);
    opacity: 0;
    filter: drop-shadow(0 1px 2px rgba(167, 116, 255, .18));
    animation: mojibaeSparkleFloat var(--sparkle-life, 620ms) cubic-bezier(.18,.72,.28,1) forwards;
  }
  .mojibae-pointer-sparkle::before {
    content: var(--sparkle-char, "✦");
    color: var(--sparkle-color, #f7b6d5);
    font-size: var(--sparkle-size, 13px);
    line-height: 1;
  }
  @keyframes mojibaeSparkleFloat {
    0% {
      opacity: 0;
      transform: translate(calc(var(--sparkle-x) - 50%), calc(var(--sparkle-y) - 50%)) scale(.45) rotate(0deg);
    }
    14% { opacity: .95; }
    100% {
      opacity: 0;
      transform: translate(calc(var(--sparkle-x) - 50% + var(--sparkle-dx)), calc(var(--sparkle-y) - 50% + var(--sparkle-dy))) scale(1.15) rotate(var(--sparkle-rot));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #mojibae-sparkle-layer { display: none !important; }
  }
</style>
<div id="mojibae-sparkle-layer" aria-hidden="true"></div>
<script>
(() => {
  const layer = document.getElementById('mojibae-sparkle-layer');
  if (!layer || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const palette = ['#F7B6D5', '#D7C7FA', '#FFD86B', '#F4A9C9', '#CBB8FF', '#FFE89B'];
  const chars = ['✦', '✧', '★', '⋆'];
  let lastX = -9999, lastY = -9999, lastAt = 0;
  let active = 0;
  const MAX_ACTIVE = 42;

  function sparkle(x, y, burst = false) {
    const now = performance.now();
    const dx0 = x - lastX, dy0 = y - lastY;
    const distance = Math.hypot(dx0, dy0);
    const minDistance = burst ? 0 : 11;
    const minTime = burst ? 0 : 28;
    if (!burst && distance < minDistance && now - lastAt < minTime) return;
    if (active >= MAX_ACTIVE) return;

    lastX = x; lastY = y; lastAt = now;
    const count = burst ? 4 : (Math.random() < .2 ? 2 : 1);

    for (let i = 0; i < count && active < MAX_ACTIVE; i++) {
      const el = document.createElement('span');
      el.className = 'mojibae-pointer-sparkle';
      const angle = Math.random() * Math.PI * 2;
      const drift = burst ? 18 + Math.random() * 24 : 8 + Math.random() * 18;
      const size = burst ? 10 + Math.random() * 8 : 8 + Math.random() * 7;
      el.style.setProperty('--sparkle-x', x + 'px');
      el.style.setProperty('--sparkle-y', y + 'px');
      el.style.setProperty('--sparkle-dx', (Math.cos(angle) * drift).toFixed(1) + 'px');
      el.style.setProperty('--sparkle-dy', (Math.sin(angle) * drift - (burst ? 9 : 5)).toFixed(1) + 'px');
      el.style.setProperty('--sparkle-rot', ((Math.random() * 150) - 75).toFixed(0) + 'deg');
      el.style.setProperty('--sparkle-size', size.toFixed(1) + 'px');
      el.style.setProperty('--sparkle-life', (burst ? 650 + Math.random() * 220 : 500 + Math.random() * 180).toFixed(0) + 'ms');
      el.style.setProperty('--sparkle-color', palette[(Math.random() * palette.length) | 0]);
      el.style.setProperty('--sparkle-char', '"' + chars[(Math.random() * chars.length) | 0] + '"');
      active++;
      layer.appendChild(el);
      el.addEventListener('animationend', () => { el.remove(); active--; }, { once: true });
    }
  }

  function onPointerMove(e) {
    // เมาส์บนคอม และนิ้ว/ปากกาบนอุปกรณ์สัมผัส ใช้เอฟเฟกต์ชุดเดียวกัน
    sparkle(e.clientX, e.clientY, false);
  }

  function onPointerDown(e) {
    sparkle(e.clientX, e.clientY, true);
  }

  if ('PointerEvent' in window) {
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerdown', onPointerDown, { passive: true });
  } else {
    window.addEventListener('mousemove', e => sparkle(e.clientX, e.clientY, false), { passive: true });
    window.addEventListener('touchstart', e => {
      const t = e.touches && e.touches[0]; if (t) sparkle(t.clientX, t.clientY, true);
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      const t = e.touches && e.touches[0]; if (t) sparkle(t.clientX, t.clientY, false);
    }, { passive: true });
  }
})();
</script>
<!-- /Mojibae pointer/touch sparkle trail -->

<!-- Mojibae global falling-stars background -->
<style>
  #root {
    position: relative;
    z-index: 1;
  }
  #mojibae-falling-stars-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 12;
  }
  .mojibae-falling-star {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    will-change: transform, opacity;
    animation: mojibaeFallingStar var(--fall-life, 7s) linear forwards;
    filter: drop-shadow(0 0 6px rgba(231, 150, 190, .32));
  }
  .mojibae-falling-star::before {
    content: var(--fall-char, "✦");
    color: var(--fall-color, #f3afcf);
    font-size: var(--fall-size, 14px);
    line-height: 1;
  }
  .mojibae-falling-star::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -18px;
    width: 1px;
    height: 18px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, transparent, var(--fall-color, #f3afcf));
    opacity: .22;
    border-radius: 999px;
  }
  @keyframes mojibaeFallingStar {
    0% {
      opacity: 0;
      transform: translate3d(var(--fall-start-x), -12vh, 0) rotate(0deg) scale(.8);
    }
    10% { opacity: .72; }
    85% { opacity: .58; }
    100% {
      opacity: 0;
      transform: translate3d(calc(var(--fall-start-x) + var(--fall-drift-x)), 112vh, 0) rotate(var(--fall-rotate, 120deg)) scale(1.08);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #mojibae-falling-stars-layer { display: none !important; }
  }
</style>
<div id="mojibae-falling-stars-layer" aria-hidden="true"></div>
<script>
(() => {
  const layer = document.getElementById('mojibae-falling-stars-layer');
  if (!layer || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (layer.dataset.ready === '1') return;
  layer.dataset.ready = '1';

  const palette = ['#F7B6D5', '#D7C7FA', '#FFD86B', '#F4A9C9', '#CBB8FF', '#FFE8A3'];
  const chars = ['✦', '✧', '★', '⋆'];
  const isMobile = window.matchMedia('(max-width: 767px)').matches;
  const maxActive = isMobile ? 12 : 18;
  const baseDelay = isMobile ? 700 : 520;
  let active = 0;

  function spawnStar() {
    if (document.hidden || active >= maxActive) return;
    const star = document.createElement('span');
    star.className = 'mojibae-falling-star';

    const left = (Math.random() * 100).toFixed(2) + 'vw';
    const drift = ((Math.random() * 18) - 9).toFixed(2) + 'vw';
    const size = (Math.random() * 9 + (isMobile ? 11 : 12)).toFixed(1) + 'px';
    const life = (Math.random() * 2.5 + (isMobile ? 5.3 : 4.9)).toFixed(2) + 's';
    const rotate = ((Math.random() * 220) - 110).toFixed(0) + 'deg';

    star.style.setProperty('--fall-start-x', left);
    star.style.setProperty('--fall-drift-x', drift);
    star.style.setProperty('--fall-size', size);
    star.style.setProperty('--fall-life', life);
    star.style.setProperty('--fall-rotate', rotate);
    star.style.setProperty('--fall-color', palette[(Math.random() * palette.length) | 0]);
    star.style.setProperty('--fall-char', '"' + chars[(Math.random() * chars.length) | 0] + '"');

    active++;
    layer.appendChild(star);
    star.addEventListener('animationend', () => {
      star.remove();
      active = Math.max(0, active - 1);
    }, { once: true });
  }

  for (let i = 0; i < (isMobile ? 6 : 8); i++) {
    window.setTimeout(spawnStar, i * 180);
  }
  window.setInterval(spawnStar, baseDelay);
})();
</script>
<!-- /Mojibae global falling-stars background -->
